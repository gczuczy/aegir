<form id="addYeast"
      [formGroup]="addYeastForm"
      (ngSubmit)="add(addYeastForm)">
</form>

<form *ngFor="let yeast of yeasts"
      id="editYeast-{{yeast.data.id!}}"
      [formGroup]="yeast.editForm"
      (ngSubmit)="edit(yeast.data.id!, yeast.editForm)">
</form>

<table class="table table-striped table-hover">
  <thead>
    <th scope="col">
      <button class="btn btn-default" (click)="addRow = !addRow">
	<fa-icon [icon]="faPlus"></fa-icon>
      </button>
    </th>
    <th scope="col">Name</th>
    <th scope="col">Attn.</th>
    <th scope="col">ABV</th>
    <th scope="col">T<sub>min</sub></th>
    <th scope="col">T<sub>max</sub></th>
    <th scope="col">&nbsp;</th>
  </thead>
  <tbody>
    <tr *ngIf="addRow" [formGroup]="addYeastForm">
	<td>&nbsp;</td>
	<td><input type="text" class="form-control form-control-sm"
		   form="addYeast" formControlName="name" id="name"></td>
	<td><input type="number" class="form-control form-control-sm"
		   form="addYeast" formControlName="attenuation" id="attenuation"></td>
	<td><input type="number" class="form-control form-control-sm"
		   form="addYeast" formControlName="abv" id="abv"></td>
	<td><input type="number" class="form-control form-control-sm"
		   form="addYeast" formControlName="mintemp" id="mintemp"></td>
	<td><input type="number" class="form-control form-control-sm"
		   form="addYeast" formControlName="maxtemp" id="maxtemp"></td>
	<td><button type="submit" class="btn btn-primary btn-sm"
		    form="addYeast" [disabled]="!addYeastForm.valid">Add</button></td>
    </tr>
    <tr *ngFor="let yeast of yeasts"
	[formGroup]="yeast.editForm">
      <!-- display mode -->
      <td *ngIf="!yeast.editMode">
	<button class="btn btn-default" (click)="yeast.editMode = true">
	  <fa-icon [icon]="faPenToSquare"></fa-icon>
	</button>
      </td>
      <td *ngIf="!yeast.editMode">{{yeast.data.name}}</td>
      <td *ngIf="!yeast.editMode">{{yeast.data.attenuation}} %</td>
      <td *ngIf="!yeast.editMode">{{yeast.data.abv}} %</td>
      <td *ngIf="!yeast.editMode">{{yeast.data.mintemp}} &deg;C</td>
      <td *ngIf="!yeast.editMode">{{yeast.data.maxtemp}} &deg;C</td>
      <td *ngIf="!yeast.editMode">
	<button class="btn btn-default" (click)="del(yeast.data.id!)">
	  <fa-icon [icon]="faXmark"></fa-icon>
	</button>
      </td>
      <!-- edit mode -->
      <td *ngIf="yeast.editMode">
	<button class="btn btn-default" (click)="yeast.editMode = false">
	  <fa-icon [icon]="faPenToSquare"></fa-icon>
	</button>
      </td>
      <td *ngIf="yeast.editMode">
	<input type="text" class="form-control form-control-sm"
	       formControlName="name" id="name"></td>
      <td *ngIf="yeast.editMode">
	<input type="number" class="form-control form-control-sm"
	       formControlName="attenuation" id="attenuation"></td>
      <td *ngIf="yeast.editMode">
	<input type="number" class="form-control form-control-sm"
	       formControlName="abv" id="abv"></td>
      <td *ngIf="yeast.editMode">
	<input type="number" class="form-control form-control-sm"
	       formControlName="mintemp" id="mintemp"></td>
      <td *ngIf="yeast.editMode">
	<input type="number" class="form-control form-control-sm"
	       formControlName="maxtemp" id="maxtemp"></td>
      <td *ngIf="yeast.editMode">
	<button type="submit" class="btn btn-primary btn-sm"
		[disabled]="!yeast.editForm.valid"
		(click)="edit(yeast.data.id!, yeast.editForm)">Save</button></td>
    </tr>
  </tbody>
</table>
